<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banner Promo Kmarote</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="margin: 0; padding: 24px; background: #121212">
    <!-- ======================================================================
         COPIE A PARTIR DAQUI  (este bloco + o <link> do style.css no <head>)
         ====================================================================== -->
    <div class="kmarote-banner">
      <img
        class="kb-photo"
        src="images/show-bts.webp"
        alt="Público em um show de K-pop visto do camarote, com palco iluminado em roxo e confetes no ar"
      />

      <div class="kb-logo">
        <img src="images/logo-kmarote.webp" alt="Logo da promoção Kmarote, da Klove.fan" />
      </div>

      <div class="kb-text">
        <p class="kb-headline">
          1 INGRESSO VIP para o camarote do show do BTS
          <span class="kb-headline__plus">+</span> 1 viagem para a Coreia do Sul.
        </p>

        <p class="kb-caption">Adquira seu pack de stickers por R$ 15,00.</p>

        <div class="kb-actions">
          <a
            class="kb-pill"
            href="https://kmarote.klove.fan/"
            target="_blank"
            rel="noopener noreferrer"
            >participe</a
          >
          <a
            class="kb-pill kb-pill--outline"
            href="https://kmarote.klove.fan/regulamento"
            target="_blank"
            rel="noopener noreferrer"
            >regulamento</a
          >
        </div>

        <p class="kb-legal">
          Consulte o regulamento completo. *Imagens meramente ilustrativas.
        </p>
      </div>
    </div>
    <!-- ======================================================================
         ATÉ AQUI
         ====================================================================== -->
  </body>
</html>
